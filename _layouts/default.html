function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function labels(){const t=ui;$('#theme').setAttribute('aria-label',document.documentElement.dataset.theme==='dark'?t.light:t.dark);$('#theme').title=$('#theme').getAttribute('aria-label');$('#theme').textContent=document.documentElement.dataset.theme==='dark'?'☀':'☾';if($('#menu'))$('#menu').setAttribute('aria-label',$('#menu').getAttribute('aria-expanded')==='true'?t.close:t.open);if($('#skip'))$('#skip').textContent=t.skip;$('#topnav').setAttribute('aria-label',t.nav);if($('.jumpnav'))$('.jumpnav').setAttribute('aria-label',t.sections)}
