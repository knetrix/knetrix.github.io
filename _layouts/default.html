<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>const $=s=>document.querySelector(s);
const ui={open:'Open menu',close:'Close menu',light:'Switch to light theme',dark:'Switch to dark theme',skip:'Skip to content',nav:'Main navigation',sections:'Sections'};
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function labels(){const t=ui;if($('#theme'))$('#theme').setAttribute('aria-label',document.documentElement.dataset.theme==='dark'?t.light:t.dark);if($('#theme'))$('#theme').title=$('#theme').getAttribute('aria-label');if($('#theme'))$('#theme').textContent=document.documentElement.dataset.theme==='dark'?'☀':'☾';if($('#menu'))$('#menu').setAttribute('aria-label',$('#menu').getAttribute('aria-expanded')==='true'?t.close:t.open);if($('#topnav'))$('#topnav').setAttribute('aria-label',t.nav);if($('.jumpnav'))$('.jumpnav').setAttribute('aria-label',t.sections)}
if($('#theme'))$('#theme').addEventListener('click',()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;store('knetrix-theme',theme);labels()});
if($('#menu'))$('#menu').addEventListener('click',()=>{const open=$('#menu').getAttribute('aria-expanded')!=='true';$('#menu').setAttribute('aria-expanded',String(open));$('#topnav').classList.toggle('open',open);labels()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#menu')){$('#topnav').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');labels()}});
document.documentElement.lang='en';
document.querySelectorAll('.skill [data-i]').forEach(el=>{const value=el.textContent,cut=value.indexOf(':');const strong=document.createElement('strong');strong.textContent=value.slice(0,cut+1);el.replaceChildren(strong,document.createTextNode(value.slice(cut+1)))});
labels();
</script></body></html>
