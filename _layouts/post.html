---
layout: default
---
<div class="reading-layout">
<article class="post-content">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </header>
  {{ content }}
</article>
<aside class="reading-toc" aria-label="Table of contents" hidden><p class="reading-toc-title">Contents</p><nav aria-label="On this page"></nav></aside>
</div>
